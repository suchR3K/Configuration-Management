---
- name: Inspect archive on the controller
  ansible.builtin.stat:
    path: "{{ app_archive }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: archive_info
- name: Require a local release archive
  ansible.builtin.assert:
    that:
      - archive_info.stat.exists
      - archive_info.stat.isreg
    fail_msg: Build or supply files/lab-portal.tar.gz on the controller.
- name: Define content-addressed release directory
  ansible.builtin.set_fact:
    release_dir: "{{ app_root }}/releases/{{ archive_info.stat.checksum }}"
- name: Create release directory
  ansible.builtin.file:
    path: "{{ release_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Upload and extract trusted website archive
  ansible.builtin.unarchive:
    src: "{{ app_archive }}"
    dest: "{{ release_dir }}"
    owner: root
    group: root
    mode: 'u=rwX,go=rX'
- name: Inspect deployed entry page
  ansible.builtin.stat:
    path: "{{ release_dir }}/index.html"
  register: deployed_index
- name: Require nonempty entry page before activating release
  ansible.builtin.assert:
    that:
      - deployed_index.stat.exists
      - deployed_index.stat.isreg
      - deployed_index.stat.size > 0
  when: not ansible_check_mode
- name: Activate release
  ansible.builtin.file:
    src: "{{ release_dir }}"
    dest: "{{ app_root }}/current"
    state: link
  when: not ansible_check_mode
